name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy/**'
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

concurrency:
  group: line-harness-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: node scripts/deploy/migrate-cloudflare.mjs --remote

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Configure manual operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          INBOX_QUEUE_NAME: ${{ vars.INBOX_QUEUE_NAME }}
          INBOX_DLQ_NAME: ${{ vars.INBOX_DLQ_NAME }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/deploy/patch-cloudflare-config.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME || 'your-worker-name' }}
